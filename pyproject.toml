[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celestin-memory"
version = "0.2.0"
description = "An MCP-powered persistent memory system for AI agents and coding assistants."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<2.0"]

[project.scripts]
celestin = "orbit.mcp_server.server:main"
celestin-index = "orbit.semantic.cli:main"
celestin-docs = "orbit.pageindex.cli:main"
# Compatibility aliases for clients configured before the Celestin rename.
orbit = "orbit.mcp_server.server:main"
memory-bridge = "orbit.mcp_server.server:main"

[project.optional-dependencies]
semantic = ["sqlite-vec>=0.1.9,<0.2", "fastembed>=0.9,<1.0"]
pageindex = ["pageindex>=0.4,<0.5"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
