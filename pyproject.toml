[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-memory-mcp"
version = "0.1.0"
description = "An MCP-powered persistent memory system for AI agents and coding assistants."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<2.0"]

[project.scripts]
orbit = "memory_bridge.mcp_server.server:main"
# Keep the existing command available for already-configured local clients.
memory-bridge = "memory_bridge.mcp_server.server:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
